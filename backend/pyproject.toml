[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
classifiers = [ "Development Status :: 4 - Beta", "Intended Audience :: Developers", "Intended Audience :: Science/Research", "Programming Language :: Python :: 3", "Topic :: Office/Business :: Office Suites", "Topic :: Scientific/Engineering :: Artificial Intelligence",]
dependencies = [
 "fastapi>=0.104.1",
 "python-dotenv>=1.0.0",
 "openai>=1.0.0",
 "uvicorn[standard]>=0.24.0",
 "motor>=3.3.0",
 "pydantic>=2.0.0",
 "python-jose[cryptography]>=3.3.0",
 "python-multipart>=0.0.6",
 "httpx>=0.25.0",
 "bcrypt>=4.0.1,<4.1.0",
 "passlib==1.7.4",
 "toml-union>=1.0.4",
 "aiometer",
 "aiofiles",
 "aiohttp",
 "beautifulsoup4",
 "fastapi[all]",
 "fastmcp>=2.10.0",
 "func_argparse",
 "html2image",
 "jinja2",
 "json_repair",
 "jsonlines",
 "lxml",
 "mcp>=1.14.0",
 "mistune",
 "numpy<2.0.0",
 "oaib",
 "openai>=1.107.3",
 "opencv-python-headless",
 "openpyxl",
 "pdf2image",
 "pillow",
 "pydantic>=2.10.0",
 "PyYAML",
 "python-Levenshtein",
 "python-multipart",
 "pptagent-pptx>=0.0.1",
 "pytest",
 "pytest-asyncio",
 "pytest-xdist",
 "rich",
 "socksio",
 "tenacity",
 "uvicorn",
 "huggingface-hub>=0.36.0",
 "fasttext>=0.9.3",
 "torch>=2.9.1",
 "transformers>=4.49.0",
 "accelerate>=1.12.0",
 "torchvision>=0.24.1",
 "python-pptx>=1.0.2",
 "google-generativeai>=0.8.5",
 "zai-sdk>=0.0.4.3",
 "langchain>=1.1.2",
 "langchain-openai>=1.1.0",
]
description = "PPTAgent, a tool for utilizing LLMs to generate PowerPoint presentations from documents."
keywords = [ "presentation", "powerpoint", "ppt", "llm", "ai", "document-processing",]
license = "MIT"
name = "AIcoro"
dynamic = ["version"]
requires-python = ">=3.11"
[[project.authors]]
email = "1280773543@qq.com"
name = "Niu"

[tool.hatch.version]
path = "src/pptagent/__init__.py"

[project.optional-dependencies]
full = [ "transformers<4.50.0", "fasttext", "einops", "peft", "huggingface_hub", "timm",]

[project.scripts]
pptagent-mcp = "pptagent.mcp_server:main"

[project.urls]
"Bug Tracker" = "https://github.com/icip-cas/PPTAgent/issues"
Homepage = "https://github.com/icip-cas/PPTAgent"


[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
markers = [ "llm: mark test as using LLM (requires OPENAI_API_KEY)", "parse: mark test as using minerU API", "asyncio: mark test as using asyncio",]

[tool.ruff.lint]
ignore = [ "F403", "F405", "E741",]


[tool.hatch.build.targets.wheel]
packages = [ "src/pptagent/",]

[tool.uv.sources]
python-pptx = { path = "../PPTAgent_0_2_0/python-pptx-master" }




